[project]
name = "feature_selector"
version = "0.1.0"
description = "Leakage-safe temporal feature selection experiments"
readme = "README.md"
authors = [
    { name = "Novikov Alexander", email = "sasha02707@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "matplotlib>=3.11.2",
    "tensorboard>=2.20",
]

[project.scripts]
feature-selector = "feature_selector.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
