data:
  features_path: ../datasets/uzk/uzk.csv
  freq: 1h
split:
  train_fraction: 0.6
  validation_fraction: 0.2
pipeline:
- name: exclusions
  type: exclude_intervals
  params:
    intervals:
    - - '2022-10-01 00:00:00'
      - '2022-10-16 23:00:00'
    - - '2023-09-20 00:00:00'
      - '2023-12-31 23:00:00'
- name: scaler
  type: standard
- name: windows
  type: windows
  params:
    lookback: 48
- name: autoencoder
  type: conv_autoencoder
  params:
    compression: features
    hidden_channels: 4
    latent_channels: 4
    epochs: 200
    batch_size: 128
    learning_rate: 0.01
    min_lr: 0.001
    weight_decay: 0.01
    patience: 30
    scheduler: true
    random_state: 0
    device: cpu
    prediction_batch_size: 1024
    mode: reconstruct
run:
  seed: 0
  output_dir: ../runs
