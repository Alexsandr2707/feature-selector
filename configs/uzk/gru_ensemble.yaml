data:
  features_path: ../../datasets/uzk/uzk.csv
  target_path: ../../datasets/uzk/uzk_lab.csv
  target_column: UZK.Q.81AY00108.FINALPOINT
  freq: 1h
split:
  train_fraction: 0.6
  validation_fraction: 0.2
pipeline:
- name: exclusions
  type: exclude_intervals
  params:
    intervals:
    - - '2022-10-01 00:00:00'
      - '2022-10-16 23:00:00'
    - - '2023-09-20 00:00:00'
      - '2023-12-31 23:00:00'
- name: filter
  type: filter
  params:
    filter_freq: 1W
    max_diff: 30
- name: scaler
  type: standard
- name: selector
  type: static
  params:
    columns:
    - 81TI10143
    - 81TI10126
    - 81FIL30066
    - 81LILH40012
    - 81TIH11209
    - 81FCL30063
    - 81FI30052
    - 81TI10123
- name: future_target
  type: align_target
  params:
    horizon: 1
- name: windows
  type: windows
  params:
    lookback: 48
- name: target_scaler
  type: target_scale
  params:
    scaler:
      type: standard
- name: model
  type: gru_ensemble
  params:
    n_estimators: 10
    alpha: 0.2
    fit_intercept: true
    random_state: 0
    gru_params:
      # max_grad_norm: 1.0
      hidden_size: 16
      num_layers: 1
      epochs: 200
      batch_size: 64
      learning_rate: 0.01
      min_lr: 0.001
      weight_decay: 0.5
      patience: 30
      checkpoint_start_epoch: 10
      scheduler: true
      device: cpu
      prediction_batch_size: 1024
run:
  experiment_name: uzk_gru_ensemble
  seed: 0
  output_dir: ../../runs
