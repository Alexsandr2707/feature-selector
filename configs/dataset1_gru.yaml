data:
  features_path: ../datasets/dataset1/features.csv
  target_path: ../datasets/dataset1/target.csv
  target_column: 35_21_1000.Q.KatKlD.1444.octanI
  freq: 1h
split:
  train_fraction: 0.6
  validation_fraction: 0.2
pipeline:
- name: scaler
  type: standard
- name: future_target
  type: align_target
  params:
    horizon: 1
- name: windows
  type: windows
  params:
    lookback: 12
- name: target_scaler
  type: target_scale
  params:
    scaler:
      type: standard
- name: model
  type: gru
  params:
    max_grad_norm: 1.0
    hidden_size: 8
    num_layers: 1
    epochs: 200
    batch_size: 128
    learning_rate: 0.01
    min_lr: 0.01
    weight_decay: 0.01
    patience: 30
    scheduler: true
    random_state: 0
    device: cpu
    prediction_batch_size: 1024
run:
  seed: 0
  output_dir: ../runs
